name: lava
services:
  db:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lava}
      POSTGRES_DB: ${POSTGRES_DB:-lava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: &api_environment
        LAVA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lava}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lava}
        LAVA_ENVIRONMENT: ${LAVA_ENVIRONMENT:-development}
        LAVA_BROWSER_ORIGIN: ${LAVA_BROWSER_ORIGIN:-http://localhost:3000}
        LAVA_COOKIE_SECURE: ${LAVA_COOKIE_SECURE:-false}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, "alembic upgrade head && python -m lava.persistence.worker_role"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 15
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      LAVA_DATABASE_URL: postgresql+psycopg://lava_worker:${POSTGRES_WORKER_PASSWORD:?Set POSTGRES_WORKER_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lava}
      LAVA_ENVIRONMENT: ${LAVA_ENVIRONMENT:-development}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [python, -m, lava.worker]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import lava.worker"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ORIGIN: ${LAVA_BROWSER_ORIGIN:-http://localhost:3000}
      LAVA_API_ORIGIN: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
