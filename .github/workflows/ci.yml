name: Phase 00
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: lava
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lava_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lava -d lava_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      LAVA_DATABASE_URL: postgresql+psycopg://lava:ci-only-password@127.0.0.1:5432/lava_test
      LAVA_INTEGRATION: "1"
      LAVA_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.13.5'
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked
      - run: ./scripts/check.sh
      - run: mkdir -p test-results
      - name: Real PostgreSQL API and migration tests
        run: >-
          uv run --project apps/api --locked python scripts/run_pytest.py
          --cwd apps/api --junit test-results/postgresql.xml -- tests -m integration
      - name: Install pinned browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Real desktop and mobile browser journeys
        run: uv run --project apps/api --locked python scripts/verify_browser.py
      - name: Reconcile scoped control-plane evaluations
        run: >-
          python3 evals/runners/control_plane.py
          --junit test-results/postgresql.xml
          --source-commit "$(git rev-parse HEAD)"
          --environment real-postgresql
          --output evals/reports/slice01-control-plane.json
      - name: Reconcile browser session and dashboard evaluations
        run: >-
          python3 evals/runners/browser_auth.py
          --backend-junit test-results/postgresql.xml
          --browser-report test-results/e2e/public/report.json
          --source-commit "$(git rev-parse HEAD)"
          --output evals/reports/phase01-current.json
      - name: Publish source-bound test and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-evidence-${{ github.sha }}
          path: |
            test-results/postgresql.xml
            evals/reports/phase01-current.json
            evals/reports/slice01-control-plane.json
            test-results/e2e/public
          if-no-files-found: warn
          retention-days: 7
      - run: mkdir -p "$RUNNER_TEMP/lava-verification"
      - run: PATH="$PWD/apps/api/.venv/bin:$PATH" ./scripts/verify-instabox.sh --data-dir "$RUNNER_TEMP/lava-verification" --allow-root-storage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bounded-redacted-compose-diagnostics
          path: ${{ runner.temp }}/lava-verification/lava-verification/run-*/commands.log
          retention-days: 3
