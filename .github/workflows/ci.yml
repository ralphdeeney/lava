name: Phase 00
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_USER: lava
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lava_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lava -d lava_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      LAVA_DATABASE_URL: postgresql+psycopg://lava:ci-only-password@127.0.0.1:5432/lava_test
      LAVA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.13.5'
      - run: npm install --global pnpm@10.32.1
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --locked
      - run: ./scripts/check.sh
      - run: cd apps/api && uv run --locked pytest tests -m integration
      - run: cp .env.example .env && echo 'POSTGRES_PASSWORD=ci-compose-only' >> .env
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
