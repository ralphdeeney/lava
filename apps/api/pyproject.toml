[project]
name = "lava-api"
version = "0.0.1"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.48",
    "psycopg[binary]==3.3.3",
    "alembic==1.18.4",
    "structlog==25.5.0",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "httpx2==2.16.0", "ruff==0.15.6"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lava"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
